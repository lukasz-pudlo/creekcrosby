[tool.black]
extend-exclude = '''
/(
    migrations
    | venv
    | env
    | \.git
    | \.tox
    | dist
    | build
)/
'''
include = '\.pyi?$'
line-length = 88
target-version = ['py312']

[tool.isort]
line_length = 88
multi_line_output = 3
profile = "black"
skip = ["migrations", "venv", "env"]

[tool.flake8]
exclude = [
  "migrations",
  "venv",
  "env",
  ".git",
  "__pycache__",
]
extend-ignore = ["E203", "W503"]
max-line-length = 88
