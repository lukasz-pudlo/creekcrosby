<div class="about-item {% cycle 'left' 'right' %}" data-section-id="{{ section.id }}">
    {% if is_staff %}
        <div class="edit-controls">
            <button class="btn btn-outline btn-sm delete-btn" 
                    hx-post="{% url 'delete_about_section' section.id %}"
                    hx-target=".about-content"
                    hx-swap="outerHTML"
                    hx-confirm="Are you sure you want to delete this section?">
                × Delete
            </button>
        </div>
    {% endif %}
    
    <div class="about-image-container">
        {% if section.image %}
            <div class="about-image">
                <img src="{{ section.image.url }}?v={{ section.image.name|default_if_none:'' }}" alt="{{ section.title }}">
                {% if is_staff %}
                    <div class="image-edit-overlay">
                        <form 
                            hx-post="{% url 'upload_about_image' section.id %}"
                            hx-target="[data-section-id='{{ section.id }}']"
                            hx-swap="outerHTML"
                            hx-encoding="multipart/form-data">
                            {% csrf_token %}
                            <input 
                                type="file" 
                                name="image" 
                                accept="image/*"
                                style="display: none;" 
                                id="image-{{ section.id }}">
                            <label for="image-{{ section.id }}" class="image-edit-btn">📷 Change Image</label>
                        </form>
                        <button class="image-edit-btn delete-image-btn" 
                                style="background: #dc3545; margin-left: 10px;"
                                hx-post="{% url 'delete_about_image' section.id %}"
                                hx-target="[data-section-id='{{ section.id }}']"
                                hx-swap="outerHTML"
                                hx-confirm="Are you sure you want to delete this image?"
                                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
                            🗑️ Delete Image
                        </button>
                    </div>
                {% endif %}
            </div>
        {% else %}
            {% if is_staff %}
                <div class="about-image image-placeholder">
                    <form 
                        hx-post="{% url 'upload_about_image' section.id %}"
                        hx-target="[data-section-id='{{ section.id }}']"
                        hx-swap="outerHTML"
                        hx-encoding="multipart/form-data">
                        {% csrf_token %}
                        <input 
                            type="file" 
                            name="image" 
                            accept="image/*"
                            style="display: none;" 
                            id="image-{{ section.id }}">
                        <label for="image-{{ section.id }}" class="image-placeholder-btn">
                            📷 Add Image
                        </label>
                    </form>
                </div>
            {% endif %}
        {% endif %}
    </div>
    
    <div class="about-text">
        <h3 class="{% if is_staff %}editable{% endif %}" 
            {% if is_staff %}
            data-field="title"
            data-value="{{ section.title }}"
            data-edit-url="{% url 'edit_about_section' section.id %}"
            onclick="makeEditable(this)"
            {% endif %}>
            {{ section.title }}
        </h3>
        <p class="{% if is_staff %}editable{% endif %}"
           {% if is_staff %}
           data-field="content"
           data-value="{{ section.content }}"
           data-edit-url="{% url 'edit_about_section' section.id %}"
           onclick="makeEditable(this)"
           {% endif %}>
            {{ section.content }}
        </p>
    </div>
</div>
