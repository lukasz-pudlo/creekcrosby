{% load markdown_extras %}

<div class="about-item {% cycle 'left' 'right' %}" data-section-id="{{ section.id }}">
    {% if is_staff %}
        <div class="edit-controls">
            <button class="btn btn-outline btn-sm delete-btn" 
                    hx-post="{% url 'delete_about_section' section.id %}"
                    hx-target=".about-sections"
                    hx-swap="outerHTML"
                    hx-confirm="Are you sure you want to delete this section?">
                Delete
            </button>
        </div>
    {% endif %}

    <div class="about-text">
        <h3 class="{% if is_staff %}editable{% endif %}" 
            {% if is_staff %}
            data-field="title"
            data-value="{{ section.title }}"
            data-edit-url="{% url 'edit_about_section' section.id %}"
            onclick="makeEditable(this)"
            {% endif %}>
            {{ section.title }}
        </h3>
        <div class="prose {% if is_staff %}editable{% endif %}"
           {% if is_staff %}
           data-field="content"
           data-value="{{ section.content }}"
           data-edit-url="{% url 'edit_about_section' section.id %}"
           onclick="makeEditable(this, 'textarea')"
           {% endif %}>
            {{ section.content|markdown }}
        </div>
    </div>
</div>
