<div class="merchandise-grid">
    {% for merchandise_item in merchandise_items %}
        <div class="merchandise-item-card" data-merchandise-item-id="{{ merchandise_item.id }}">
            {% if merchandise_item.image %}
                <div class="merchandise-item-image">
                    <img src="{{ merchandise_item.image.url }}" loading="lazy"
                         alt="{{ merchandise_item.name }}">
                </div>
            {% endif %}
            <h3>{{ merchandise_item.name }}</h3>
        </div>
    {% empty %}
        <p class="no-media">Nothing in the shop at the moment.</p>
    {% endfor %}
</div>
