{% if contact_info %}
    {% if contact_info.social_facebook %}
        <a href="{{ contact_info.social_facebook }}" aria-label="Facebook" target="_blank" rel="noopener noreferrer">
            <span class="icon">📘</span>
        </a>
    {% endif %}
    
    {% if contact_info.social_instagram %}
        <a href="{{ contact_info.social_instagram }}" aria-label="Instagram" target="_blank" rel="noopener noreferrer">
            <span class="icon">📷</span>
        </a>
    {% endif %}
    
    {% if contact_info.social_twitter %}
        <a href="{{ contact_info.social_twitter }}" aria-label="Twitter" target="_blank" rel="noopener noreferrer">
            <span class="icon">🐦</span>
        </a>
    {% endif %}
    
    {% if contact_info.social_linkedin %}
        <a href="{{ contact_info.social_linkedin }}" aria-label="LinkedIn" target="_blank" rel="noopener noreferrer">
            <span class="icon">💼</span>
        </a>
    {% endif %}
{% else %}
    <a href="https://facebook.com/creekhq" aria-label="Facebook" target="_blank" rel="noopener noreferrer">
        <span class="icon">📘</span>
    </a>
    
    <a href="https://instagram.com/creekcrosby" aria-label="Instagram" target="_blank" rel="noopener noreferrer">
        <span class="icon">📷</span>
    </a>
{% endif %}
