<div class="about-sections">
    {% if is_staff %}
        <div class="edit-controls">
            <button class="btn btn-primary btn-sm" 
                    hx-post="{% url 'add_about_section' %}"
                    hx-target=".about-sections"
                    hx-swap="outerHTML">
                Add section
            </button>
        </div>
    {% endif %}
    
    {% for section in about_sections %}
        {% include 'partials/about_section_item.html' with section=section index=forloop.counter0 is_staff=is_staff %}
    {% empty %}
        <div class="about-item">
            <div class="about-text">
                {% if is_staff %}
                    <p>No sections yet.</p>
                {% else %}
                    <p>The story is on its way.</p>
                {% endif %}
            </div>
        </div>
    {% endfor %}
</div>
