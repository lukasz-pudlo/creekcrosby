# Shared strict security headers (copied from the CPX32 box so both VPSes
# behave identically). Install to /etc/nginx/snippets/security-headers.conf.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# HSTS — uncomment AFTER HTTPS is confirmed working for each site
add_header Strict-Transport-Security "max-age=31536000" always;
