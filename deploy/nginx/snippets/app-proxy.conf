# Shared reverse-proxy directives for a per-app vhost. Install to
# /etc/nginx/snippets/app-proxy.conf. The server block must set the stack's
# web port before including:
#
#     set $app_port 8001;
#     location / {
#         include snippets/app-proxy.conf;
#     }
#
# proxy_pass with a variable skips upstream resolution quirks only for DNS
# names; a literal 127.0.0.1 needs no resolver.
proxy_pass http://127.0.0.1:$app_port;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
