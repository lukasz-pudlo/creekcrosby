# Same as security-headers.conf but WITHOUT X-Frame-Options, for sites that
# are embedded in the portfolio iframe. The app's own CSP frame-ancestors
# header (FrameAncestorsMiddleware) controls who may embed.
# Install to /etc/nginx/snippets/security-headers-embeddable.conf.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# HSTS — uncomment AFTER HTTPS is confirmed working for each site
add_header Strict-Transport-Security "max-age=31536000" always;
