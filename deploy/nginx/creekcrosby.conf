# nginx vhost for creekcrosby (creekcrosby.co.uk + www) on the new Hetzner
# VPS — copy to /etc/nginx/sites-available/creekcrosby, symlink into
# sites-enabled/, reload nginx:
#
#   sudo cp /srv/creekcrosby/repo/deploy/nginx/creekcrosby.conf /etc/nginx/sites-available/creekcrosby
#   sudo ln -sf /etc/nginx/sites-available/creekcrosby /etc/nginx/sites-enabled/creekcrosby
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d creekcrosby.co.uk -d www.creekcrosby.co.uk \
#     --non-interactive --agree-tos -m l.pudlo1990@gmail.com --redirect
#
# certbot rewrites this file on issuance to add the :443 listener and the
# HTTP->HTTPS redirect; after that the installed copy is maintained by hand.
#
# Uses the EMBEDDABLE header snippet (no X-Frame-Options): the production site
# is embedded in the portfolio case-study iframe at lukaszpudlo.com, and
# Django's FrameAncestorsMiddleware emits the CSP frame-ancestors policy.
# Adding X-Frame-Options here would break the embed.

server {
    listen 80;
    server_name creekcrosby.co.uk www.creekcrosby.co.uk;
    set $app_port 8001;

    include snippets/security-headers-embeddable.conf;

    # Matches Django's FILE_UPLOAD_MAX_MEMORY_SIZE (50MB)
    client_max_body_size 50m;

    location /healthz/ {
        access_log off;
        include snippets/app-proxy.conf;
    }

    # Uploaded media served straight off the compose stack's volume —
    # keeps large files out of the gunicorn workers.
    location /media/ {
        alias /srv/creekcrosby/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        include snippets/app-proxy.conf;
    }

    access_log /var/log/nginx/creekcrosby.access.log;
    error_log  /var/log/nginx/creekcrosby.error.log;
}
